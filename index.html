<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rehan School Coding Projects</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#17202a;--muted:#68737d;--line:#dfe5e8;--accent:#ee684a;--paper:#f7f8f5;--card:#fff}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font-family:'DM Sans',sans-serif}header,main,footer{max-width:1100px;margin:auto;padding-left:24px;padding-right:24px}header{display:flex;justify-content:space-between;align-items:center;padding-top:24px;padding-bottom:24px;border-bottom:1px solid var(--line)}.brand{display:flex;gap:12px;align-items:center;text-decoration:none;color:var(--ink)}.mark{display:grid;place-items:center;width:42px;height:42px;background:var(--ink);color:#fff;font:700 20px 'Space Grotesk';border-radius:10px}.brand strong{display:block;font-size:16px}.brand small{color:var(--muted)}.brand strong,h1,h2{font-family:'Space Grotesk',sans-serif}nav a,.text-link{color:var(--ink);font-weight:600;text-decoration:none}nav a:hover,.text-link:hover{color:var(--accent)}main{padding-top:72px;padding-bottom:76px}.intro{display:flex;justify-content:space-between;gap:40px;align-items:end;margin-bottom:42px}h1{font-size:clamp(40px,7vw,76px);line-height:.98;max-width:650px;margin:0 0 20px;letter-spacing:-2px}.intro p{max-width:440px;color:var(--muted);font-size:18px;line-height:1.6;margin:0}.search{display:flex;gap:10px;margin-bottom:32px}input{width:100%;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:13px 15px;color:var(--ink);font:inherit}.search input{max-width:480px}button{border:0;border-radius:8px;background:var(--accent);color:#fff;padding:0 20px;font:600 14px 'DM Sans';cursor:pointer}button:hover{filter:brightness(.94)}.section-head{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:18px;margin-bottom:18px}h2{font-size:18px;margin:0}#resultCount{color:var(--muted);font-size:14px}#projectsGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;min-height:275px;transition:transform .2s,box-shadow .2s}.card:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(23,32,42,.08)}.card-image{width:100%;height:150px;object-fit:cover}.card-body{padding:20px;display:flex;flex:1;flex-direction:column}.day{color:var(--accent);font:700 13px 'Space Grotesk';letter-spacing:.5px;text-transform:uppercase}.card h3{font:600 21px 'Space Grotesk';margin:10px 0 8px}.card p{color:var(--muted);line-height:1.5;margin:0;font-size:14px}.card-foot{margin-top:auto;padding-top:18px;display:flex;gap:16px;font-size:13px}.empty{grid-column:1/-1;color:var(--muted);padding:48px 0;text-align:center}footer{border-top:1px solid var(--line);color:var(--muted);font-size:13px;padding-top:22px;padding-bottom:22px}@media(max-width:760px){header{padding-top:16px;padding-bottom:16px}.brand small{display:none}main{padding-top:48px}.intro{display:block}h1{margin-bottom:16px}#projectsGrid{grid-template-columns:1fr}.search input{max-width:none}.search{flex-direction:column}button{min-height:46px}}
</style></head>
<body><header><a class="brand" href="/"><span class="mark"><img src="/assets/rehan-school-logo.png" alt="Rehan School logo" style="width:100%;height:100%;object-fit:contain" onerror="this.remove();this.nextElementSibling.style.display='block'"><span style="display:none">R</span></span><span><strong>Rehan School</strong><small>Coding projects</small></span></a><nav><a href="/admin">Admin login</a></nav></header><main><section class="intro"><div><h1>Learning in public,<br>one day at a time.</h1><p>A living archive of my Rehan School coding tasks, experiments, and finished projects.</p></div></section><form class="search" id="searchForm"><input id="searchInput" aria-label="Search projects" placeholder="Search by day, title, category, or description"><button type="submit">Search</button></form><section><div class="section-head"><h2>Project log</h2><span id="resultCount">Loading...</span></div><div id="projectsGrid"></div></section></main><footer>Built with care for Rehan School coding tasks.</footer>
<script>const grid=document.querySelector('#projectsGrid'),input=document.querySelector('#searchInput'),count=document.querySelector('#resultCount');const esc=value=>String(value||'').replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));async function loadProjects(query=''){const response=await fetch('/api/projects?q='+encodeURIComponent(query));const projects=await response.json();count.textContent=`${projects.length} ${projects.length===1?'project':'projects'}`;grid.innerHTML=projects.length?projects.map(project=>`<article class="card">${project.screenshot_url?`<img class="card-image" src="${esc(project.screenshot_url)}" alt="Screenshot of ${esc(project.title)}">`:''}<div class="card-body"><span class="day">Day ${esc(project.day_number)}${project.category?` · ${esc(project.category)}`:''}</span><h3>${esc(project.title)}</h3><p>${esc(project.description)||'A Rehan School coding project.'}</p><div class="card-foot"><a class="text-link" href="/project.html?id=${project.id}">View details</a>${project.live_demo_url?`<a class="text-link" href="${esc(project.live_demo_url)}" target="_blank" rel="noopener">Live demo</a>`:''}</div></div></article>`).join(''):'<p class="empty">No projects match that search yet.</p>'}document.querySelector('#searchForm').addEventListener('submit',event=>{event.preventDefault();loadProjects(input.value)});input.addEventListener('input',()=>loadProjects(input.value));loadProjects();</script></body></html>
