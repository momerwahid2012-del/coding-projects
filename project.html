<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Project Details | Muhammad Omer</title>
  <meta name="description" content="Project details for a coding project by Muhammad Omer.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f5f7f8;
      --bg-soft: #edf3f2;
      --card: #ffffff;
      --ink: #111827;
      --muted: #5f6b7a;
      --line: #dfe7ea;
      --primary: #1b6ef3;
      --primary-soft: rgba(27,110,243,0.12);
      --shadow: 0 18px 42px rgba(15, 23, 42, 0.08);
      --radius: 24px;
    }

    html[data-theme="dark"] {
      --bg: #0b1220;
      --bg-soft: #111b2d;
      --card: #101b2b;
      --ink: #e5eef9;
      --muted: #9aaabc;
      --line: rgba(148, 163, 184, 0.22);
      --primary: #79a8ff;
      --primary-soft: rgba(121,168,255,0.12);
      --shadow: 0 18px 42px rgba(2,6,23,0.35);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: linear-gradient(180deg, var(--bg) 0%, var(--bg-soft) 100%); color: var(--ink); font-family: 'DM Sans', sans-serif; line-height: 1.6;
    }
    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; display: block; }
    button { font: inherit; }

    .container { width: min(1000px, calc(100% - 32px)); margin: 0 auto; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between; min-height: 74px; border-bottom: 1px solid var(--line); backdrop-filter: blur(10px); background: rgba(245,247,248,0.72);
    }
    html[data-theme="dark"] .topbar { background: rgba(11,18,32,0.72); }

    .back-link {
      display: inline-flex; align-items: center; gap: 8px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 999px; background: rgba(255,255,255,0.4); color: var(--ink); font-weight: 700;
    }
    .theme-toggle {
      width: 44px; height: 44px; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 50%; cursor: pointer;
    }

    .page { padding: 42px 0 72px; }
    .project-shell {
      background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: clamp(18px, 4vw, 32px); box-shadow: var(--shadow);
    }
    .project-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .badge {
      display: inline-flex; align-items: center; padding: 7px 10px; border-radius: 999px; background: var(--primary-soft); color: var(--primary); font-size: 0.76rem; font-weight: 700; letter-spacing: 0.02em;
    }
    h1 {
      margin: 0; font-family: 'Space Grotesk', sans-serif; letter-spacing: -0.05em; font-size: clamp(2.4rem, 5vw, 4rem); line-height: 1.02;
    }
    .project-hero {
      margin-top: 22px; border: 1px solid var(--line); border-radius: 20px; overflow: hidden; background: linear-gradient(135deg, rgba(27,110,243,0.06), rgba(15,23,42,0.03));
    }
    .project-hero img {
      width: 100%; max-height: 430px; object-fit: cover; object-position: center; border-radius: 18px;
    }
    .project-hero__placeholder {
      min-height: 260px; display: grid; place-items: center; font-family: 'Space Grotesk', sans-serif; font-size: 1.5rem; color: var(--muted); background: linear-gradient(135deg, rgba(148,163,184,0.08), rgba(15,23,42,0.03));
    }
    .project-grid { display: grid; grid-template-columns: 1.5fr 0.8fr; gap: 26px; margin-top: 28px; }
    .project-summary, .project-aside {
      background: rgba(255,255,255,0.18); border: 1px solid var(--line); border-radius: 18px; padding: 20px;
    }
    .project-summary p, .project-aside p { margin: 0; color: var(--muted); font-size: 1.06rem; }
    .meta-list { display: grid; gap: 16px; margin-top: 4px; }
    .meta-item { display: flex; flex-direction: column; gap: 6px; }
    .meta-item span {
      font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 700;
    }
    .meta-item strong { font-size: 1rem; }
    .tag-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .tag { display: inline-flex; align-items: center; border-radius: 999px; padding: 7px 10px; background: rgba(148,163,184,0.12); border: 1px solid var(--line); font-size: 0.75rem; font-weight: 700; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; }
    .button {
      display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 18px; border-radius: 12px; border: 1px solid transparent; font-weight: 700; transition: transform 0.2s ease;
    }
    .button:hover, .button:focus-visible { transform: translateY(-1px); }
    .button--primary { background: linear-gradient(135deg, var(--primary), #2d86ff); color: white; }
    .button--secondary { background: transparent; border-color: var(--line); color: var(--ink); }
    .not-found {
      display: grid; place-items: center; min-height: 45vh; text-align: center; color: var(--muted);
    }
    .not-found h1 { margin-bottom: 8px; }

    @media (max-width: 720px) {
      .project-grid { grid-template-columns: 1fr; }
      .actions { flex-direction: column; }
      .button { width: 100%; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="container" style="display:flex;justify-content:space-between;align-items:center;gap:16px;">
      <a class="back-link" href="/">← Back to Projects</a>
      <button class="theme-toggle" type="button" id="themeToggle" aria-label="Toggle light and dark mode">🌙</button>
    </div>
  </header>

  <main class="page">
    <div class="container">
      <article id="projectDetail" aria-live="polite"></article>
    </div>
  </main>

  <script>
    const projectDetail = document.getElementById('projectDetail');
    const themeToggle = document.getElementById('themeToggle');

    const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (char) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[char]));

    const cleanText = (value) => String(value ?? '')
      .replace(/\*\*(.*?)\*\*/g, '$1')
      .replace(/[*_`>#-]/g, '')
      .replace(/\s+/g, ' ')
      .trim();

    function setTheme(theme) {
      const safeTheme = theme === 'dark' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', safeTheme);
      localStorage.setItem('portfolio-theme', safeTheme);
      themeToggle.textContent = safeTheme === 'dark' ? '☀️' : '🌙';
    }

    const savedTheme = localStorage.getItem('portfolio-theme');
    setTheme(savedTheme || 'light');
    themeToggle.addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
      setTheme(current === 'dark' ? 'light' : 'dark');
    });

    async function loadProject() {
      const params = new URLSearchParams(window.location.search);
      const projectId = params.get('id');

      if (!projectId) {
        projectDetail.innerHTML = '<div class="not-found"><div><h1>Project not found</h1><p>The requested project could not be loaded.</p></div></div>';
        return;
      }

      try {
        const response = await fetch(`/api/projects/${projectId}`);
        const project = await response.json();

        if (!response.ok || !project || project.error) {
          throw new Error(project?.error || 'Project not found');
        }

        document.title = `${project.title} | Muhammad Omer`;
        const image = project.screenshot_url
          ? `<img src="${esc(project.screenshot_url)}" alt="${esc(project.title)} project preview">`
          : '<div class="project-hero__placeholder">Project Preview</div>';

        const liveLink = project.live_demo_url
          ? `<a class="button button--primary" href="${esc(project.live_demo_url)}" target="_blank" rel="noopener noreferrer">Live Project</a>`
          : '';
        const sourceLink = project.source_code_url
          ? `<a class="button button--secondary" href="${esc(project.source_code_url)}" target="_blank" rel="noopener noreferrer">Source Code</a>`
          : '';
        const tags = project.category
          ? `<div class="tag-list"><span class="tag">${esc(project.category)}</span></div>`
          : '';
        const description = cleanText(project.description) || 'No description was added for this project.';

        projectDetail.innerHTML = `
          <div class="project-shell">
            <div class="project-meta">
              <span class="badge">${project.day_number ? `Day ${esc(project.day_number)}` : 'Project'}</span>
              ${project.category ? `<span class="badge">${esc(project.category)}</span>` : ''}
            </div>

            <h1>${esc(project.title)}</h1>

            <div class="project-hero">${image}</div>

            <div class="project-grid">
              <div class="project-summary">
                <p>${esc(description)}</p>
              </div>

              <aside class="project-aside">
                <div class="meta-list">
                  <div class="meta-item">
                    <span>Category</span>
                    <strong>${project.category ? esc(project.category) : 'Not set'}</strong>
                  </div>
                  <div class="meta-item">
                    <span>Technologies</span>
                    <div>${tags || '<strong>Not provided</strong>'}</div>
                  </div>
                </div>
              </aside>
            </div>

            <div class="actions">
              ${liveLink}
              ${sourceLink}
            </div>
          </div>
        `;
      } catch (error) {
        projectDetail.innerHTML = '<div class="not-found"><div><h1>Project not found</h1><p>The project details could not be loaded.</p></div></div>';
      }
    }

    loadProject();
  </script>
</body>
</html>
