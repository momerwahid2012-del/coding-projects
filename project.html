<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project | Rehan School</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><style>:root{--ink:#17202a;--muted:#68737d;--accent:#ee684a;--paper:#f7f8f5}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans',sans-serif}main{max-width:800px;margin:auto;padding:70px 24px}a{color:var(--ink);font-weight:600;text-decoration:none}.back{color:var(--accent)}.day{color:var(--accent);font:700 14px 'Space Grotesk';text-transform:uppercase;letter-spacing:.5px}h1{font:700 clamp(38px,7vw,64px) 'Space Grotesk';line-height:1;margin:14px 0}p{color:var(--muted);font-size:18px;line-height:1.65}.shot{width:100%;max-height:480px;object-fit:cover;border-radius:10px;margin:24px 0}.links{display:flex;gap:20px;margin-top:30px;flex-wrap:wrap}</style></head><body><main id="content"><a class="back" href="/">← Back to projects</a></main><script>const esc=v=>String(v||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));fetch('/api/projects/'+new URLSearchParams(location.search).get('id')).then(r=>r.json()).then(p=>{if(p.error)throw Error();document.title=p.title+' | Rehan School';document.querySelector('#content').innerHTML=`<a class="back" href="/">← Back to projects</a><p class="day">Day ${esc(p.day_number)}${p.category?` · ${esc(p.category)}`:''}</p><h1>${esc(p.title)}</h1>${p.screenshot_url?`<img class="shot" src="${esc(p.screenshot_url)}" alt="Screenshot of ${esc(p.title)}">`:''}<p>${esc(p.description)||'A Rehan School coding project.'}</p><div class="links">${p.live_demo_url?`<a class="back" href="${esc(p.live_demo_url)}" target="_blank" rel="noopener">Open live demo ↗</a>`:''}${p.source_code_url?`<a href="${esc(p.source_code_url)}" target="_blank" rel="noopener">View source ↗</a>`:''}</div>`}).catch(()=>document.querySelector('#content').innerHTML='<a class="back" href="/">← Back to projects</a><h1>Project not found</h1>');</script></body></html>
